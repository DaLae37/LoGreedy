# LoGreedy 0.1.0 — UTF-8. Paths are relative to this properties file.
agent.id=logreedy-server01
agent.environment=development
# agent.host=server01
agent.log.path=../data/agent.log
agent.log.level=INFO
shutdown.timeout.ms=15000

sources=application
# Multiple globs are separated by |. Use / on Windows too (C:/logs/*.log).
source.application.paths=../logs/*.log
source.application.application=example-app
source.application.charset=UTF-8
source.application.initial=end
# Optional: a new header starts an event; other lines continue it.
# Double backslashes in .properties regex values.
# source.application.multiline.start=^\\d{4}-\\d{2}-\\d{2}
source.application.multiline.timeout.ms=2000
# Optional named groups: timestamp, level, logger, message.
# source.application.extract.regex=^(?<timestamp>\\S+) (?<level>\\S+) (?<logger>\\S+) (?<message>.*)

poll.ms=1000
read.buffer.bytes=65536
read.max.bytes.per.file=262144
files.max=128
scan.entries.max=10000
scan.depth.max=16
file.retire.ms=60000
event.max.bytes=262144
event.max.lines=1000
checkpoint.path=../data/checkpoint/state.bin
spool.path=../data/spool
# Includes compaction reserve; usable WAL capacity is below half this value.
spool.max.bytes=268435456

loki.url=https://localhost:3100/loki/api/v1/push
loki.allow.http=false
# Whole Authorization header from an environment variable (e.g. Bearer ... / Basic ...).
loki.auth.env=
loki.tenant=
# Optional custom truststore; certificate and hostname validation always remain enabled.
loki.tls.truststore.path=
loki.tls.truststore.type=PKCS12
loki.tls.truststore.password.env=
loki.gzip=true
loki.batch.events=100
loki.batch.bytes=1048576
loki.connect.timeout.ms=5000
loki.read.timeout.ms=10000
loki.retry.initial.ms=1000
loki.retry.max.ms=60000
# ingest keeps historical log text without Loki old-timestamp rejections.
loki.timestamp.mode=ingest
# Optional Loki structured metadata requires compatible Loki configuration.
loki.structured.metadata=false
# Current sender uses one ordered lane; this is an upper bound, not a throughput knob.
send.concurrency=1
