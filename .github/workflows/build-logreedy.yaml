name: logreedy - Java CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    concurrency:
      group: logreedy-verify-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 8
        id: java8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Java 11
        id: java11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Java 17
        id: java17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Java 21
        id: java21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Java 25
        id: java25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: false
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build and test
        shell: bash
        env:
          LOGREEDY_JAVA8_HOME: ${{ steps.java8.outputs.path }}
          LOGREEDY_JAVA21_HOME: ${{ steps.java21.outputs.path }}
        run: ./gradlew clean build --no-daemon
      - name: Test release automation
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify runtime compatibility
        env:
          LOGREEDY_JAVA8_HOME: ${{ steps.java8.outputs.path }}
          LOGREEDY_JAVA11_HOME: ${{ steps.java11.outputs.path }}
          LOGREEDY_JAVA17_HOME: ${{ steps.java17.outputs.path }}
          LOGREEDY_JAVA21_HOME: ${{ steps.java21.outputs.path }}
          LOGREEDY_JAVA25_HOME: ${{ steps.java25.outputs.path }}
        run: python scripts/verify-runtime.py --require-versions 8,11,17,21,25
      - name: Prepare release files
        run: python scripts/artifacts.py --prepare
      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LoGreedy-${{ matrix.os }}-${{ github.sha }}
          path: build/distributions/all/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ github.sha }}
          path: |
            logreedy-core/build/reports/tests/
            logreedy-core/build/test-results/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: logreedy-publish
      cancel-in-progress: false

    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LoGreedy-ubuntu-latest-${{ github.sha }}
          path: build/distributions/all/
      - name: Verify release files
        run: python scripts/artifacts.py
      - name: Publish new version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/release.py
